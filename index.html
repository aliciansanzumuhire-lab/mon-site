<div class="wrap">
<header><h1>✦ mon <span>petit coin</span> du web ✦</h1><div style="display:flex;gap:8px"><button class="tog" id="exp">⬇ Exporter mes données</button><button class="tog" id="theme" aria-label="Thème">◐</button></div></header>
<nav id="nav"></nav>

<script id="app">
/* =====================================================================
   ✦ CONFIGURATION : MES DONNÉES PUBLIQUES (visibles par tout le monde sur GitHub Pages) ✦
   ---------------------------------------------------------------------
   1. Mets tes images dans un dossier "images/" à côté de ce fichier (index.html).
   2. Ajoute un objet par élément dans le tableau ci-dessous. Chaque "id" doit être unique.
   3. Astuce : ajoute tout depuis ton navigateur avec les boutons "+", puis clique sur
      "⬇ Exporter mes données" : le code est généré, colle-le à la place du tableau.
   Types possibles :
     {id:'banner', type:'banner', img:'images/banniere.jpg'}
     {id:'n1', type:'note',  k:'2026-11-16', t:'Mon texte'}                (k = date AAAA-MM-JJ)
     {id:'p1', type:'page',  cat:'anime', img:'images/scrapbook1.jpg', t:'Titre', d:'2026-11-16'}
                              (cat = 'anime' | 'musique' | 'timbres')
     {id:'a1', type:'album', t:'Album', a:'Artiste', img:'images/album1.jpg', amb:'Ambiance',
                              tracks:['Titre 1','Titre 2'], fav:2}           (fav = n° de piste préférée)
     {id:'m1', type:'media', cat:'anime', tab:'cours', t:'Titre', mood:'Ambiance',
                              avis:'Mon avis', img:'images/affiche1.jpg'}
                              (cat = 'anime'|'series'|'films'|'livres' ; tab = 'cours'|'coeur'|'voir')
     {id:'t1', type:'top', t:'Titre', a:'Artiste', img:'images/top1.jpg', avis:'Pourquoi'}   (Top 3 du mois, 3 max)
     {type:'mood', k:'2026-11-16', m:0}   (m = 0 😄 1 🥰 2 🙂 3 😴 4 😢 5 😤 6 🤒)

/* ---- Données : public (MES_DONNEES) + local (localStorage) ---- */
MES_DONNEES.forEach((i,n)=>{if(i.type!=='mood')i.id=i.id||'d'+n});
const PUB=MES_DONNEES.filter(i=>i.type!=='mood'),PUBIDS=PUB.map(i=>i.id);
let L=store.get('loc',{add:[],edit:{},del:[]});
const items=()=>[...PUB.filter(i=>!L.del.includes(i.id)).map(i=>L.edit[i.id]||i),...L.add.filter(i=>!PUBIDS.includes(i.id))];
const of=t=>items().filter(i=>i.type===t);
function saveItem(it){if(PUBIDS.includes(it.id))L.edit[it.id]=it;else{const n=L.add.findIndex(x=>x.id===it.id);n>=0?L.add[n]=it:L.add.push(it)}return store.set('loc',L)}
function delItem(id){if(PUBIDS.includes(id)){L.del.push(id);delete L.edit[id]}else L.add=L.add.filter(x=>x.id!==id);store.set('loc',L)}
let moods={...Object.fromEntries(MES_DONNEES.filter(i=>i.type==='mood').map(i=>[i.k,i.m])),...store.get('moods3',{})};
const setMood=(k,m)=>{moods[k]=m;store.set('moods3',moods)};
const hasMood=k=>moods[k]!=null&&moods[k]>=0;
const bgi=(src,fb)=>src?`background-image:url('${src}')`:`background:${fb}`;

/* ---- Images : import depuis l'ordinateur ---- */
function pick(){return new Promise(r=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.78))};im.src=fr.result};fr.readAsDataURL(f)};i.click()})}

function show(id){if(!TABS.some(t=>t[0]===id))id='home';$$('section').forEach(s=>s.classList.toggle('on',s.id===id));$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===id))}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)location.hash=b.dataset.t};
addEventListener('hashchange',()=>show(location.hash.slice(1)));

function renderHome(){
 const bn=of('banner')[0],m=moods[TODAY],tn=of('note').filter(n=>n.k===TODAY).pop(),al=of('album').find(a=>a.id===CUR.album)||of('album').pop(),cur=of('media').find(x=>x.id===CUR.media)||of('media').find(x=>x.tab==='cours');

function renderJournal(){
 const nd=new Date(vy,vm+1,0).getDate(),off=(new Date(vy,vm,1).getDay()+6)%7,dn=of('note').filter(n=>n.k===selDay),sm=moods[selDay];

 for(let d=1;d<=nd;d++){const k=pre+pad(d);if(hasMood(k))pts.push({d,k,m:moods[k],x:X(d),y:Y(LV[moods[k]])})}

function pickImg(){return new Promise(r=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>r(im);im.src=fr.result};fr.readAsDataURL(f)};i.click()})}
let CR=null;
function cropDraw(){const{im,W,H,s0,z}=CR,s=s0*z,w=im.naturalWidth*s,h=im.naturalHeight*s;CR.x=Math.min(0,Math.max(W-w,CR.x));CR.y=Math.min(0,Math.max(H-h,CR.y));const i=$('#cropi');i.style.width=w+'px';i.style.height=h+'px';i.style.transform=`translate(${CR.x}px,${CR.y}px)`}
function openCrop(im){M={...M,mode:'crop'};
 modal(`<p style="margin:0 0 10px">Déplace l’image à la souris et zoome avec le curseur : le cadre correspond exactement à la bannière (ratio 1920×600).</p><div id="cropf" style="position:relative;width:100%;aspect-ratio:1920/600;overflow:hidden;border:2px solid var(--ink);background:#111;cursor:grab;touch-action:none;user-select:none"><img id="cropi" alt="" draggable="false" style="position:absolute;left:0;top:0;max-width:none;pointer-events:none"></div><div class="fld" style="display:flex;gap:10px;align-items:center"><span>🔍−</span><input type="range" id="cropz" min="1" max="4" step="0.01" value="1" style="flex:1;padding:0" aria-label="Zoom"><span>🔍+</span></div>`,'<button class="chip" data-ccancel>Annuler</button><button class="btn" data-cok>Valider et enregistrer</button>');
 const fr=$('#cropf'),W=fr.clientWidth,H=W*600/1920,s0=Math.max(W/im.naturalWidth,H/im.naturalHeight);
 CR={im,W,H,s0,z:1,x:(W-im.naturalWidth*s0)/2,y:(H-im.naturalHeight*s0)/2};$('#cropi').src=im.src;cropDraw();
 let d=null;
 fr.onpointerdown=e=>{d={px:e.clientX,py:e.clientY,x:CR.x,y:CR.y};fr.setPointerCapture(e.pointerId);fr.style.cursor='grabbing'};
 fr.onpointermove=e=>{if(!d)return;CR.x=d.x+e.clientX-d.px;CR.y=d.y+e.clientY-d.py;cropDraw()};
 fr.onpointerup=fr.onpointercancel=()=>{d=null;fr.style.cursor='grab'};
 $('#cropz').oninput=e=>{const n=+e.target.value,s=CR.s0*CR.z,cx=(CR.W/2-CR.x)/s,cy=(CR.H/2-CR.y)/s;CR.z=n;const s2=CR.s0*n;CR.x=CR.W/2-cx*s2;CR.y=CR.H/2-cy*s2;cropDraw()}}
