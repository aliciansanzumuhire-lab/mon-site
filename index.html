<script id="app">
/* =====================================================================
   ✦ CONFIGURATION : MES DONNÉES PUBLIQUES (visibles par tout le monde sur GitHub Pages) ✦
   ---------------------------------------------------------------------
   1. Mets tes images dans un dossier "images/" à côté de ce fichier (index.html).
   2. Ajoute un objet par élément dans le tableau ci-dessous. Chaque "id" doit être unique.
   3. Astuce : ajoute tout depuis ton navigateur avec les boutons "+", puis clique sur
      "⬇ Exporter mes données" : le code est généré, colle-le à la place du tableau.
   Types possibles :
     {id:'banner', type:'banner', img:'images/banniere.jpg'}
     {id:'n1', type:'note',  k:'2026-11-16', t:'Mon texte'}                (k = date AAAA-MM-JJ)
     {id:'p1', type:'page',  cat:'anime', img:'images/scrapbook1.jpg', t:'Titre', d:'2026-11-16'}
                              (cat = 'anime' | 'musique' | 'timbres')
     {id:'a1', type:'album', t:'Album', a:'Artiste', img:'images/album1.jpg', amb:'Ambiance',
                              tracks:['Titre 1','Titre 2'], fav:2}           (fav = n° de piste préférée)
     {id:'m1', type:'media', cat:'anime', tab:'cours', t:'Titre', mood:'Ambiance',
                              avis:'Mon avis', img:'images/affiche1.jpg'}
                              (cat = 'anime'|'series'|'films'|'livres' ; tab = 'cours'|'coeur'|'voir')
     {id:'t1', type:'top', t:'Titre', a:'Artiste', img:'images/top1.jpg', avis:'Pourquoi'}   (Top 3 du mois, 3 max)
     {type:'mood', k:'2026-11-16', m:0}   (m = 0 😄 1 🥰 2 🙂 3 😴 4 😢 5 😤 6 🤒)
   ===================================================================== */
const MES_DONNEES = [
  {"id":"umwjupn3j5xk","type":"page","cat":"anime","d":"2026-11-16","t":"Mr Fixer","img":"images/umwjupn3j5xk.jpg"},
];

function pick(){return new Promise(r=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.78))};im.src=fr.result};fr.readAsDataURL(f)};i.click()})}

/* ---- Modale universelle : zoom / modifier / supprimer ---- */

const closeM=()=>{$('#ov').hidden=true;M=null;confirmDel=false};
function viewHTML(it){
 if(it.type==='note')return `<span class="badge">${it.k}</span><p style="font-size:1.15rem;white-space:pre-wrap">${esc(it.t)}</p>`;
 if(it.type==='page')return `${it.img?`<img class="big" src="${it.img}" alt="">`:''}<h2 style="margin-top:12px">${esc(it.t)}</h2><span class="badge">${it.d||''}</span>`;
 if(it.type==='album'){const tr=it.tracks||[];return `<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center"><div class="big-cd"></div><div style="flex:1;min-width:200px"><h2>${esc(it.t)}</h2><p>${esc(it.a)}</p>${it.amb?`<span class="badge" style="background:#e3dcff">🎧 ${esc(it.amb)}</span>`:''}</div>${it.img?`<img src="${it.img}" alt="" style="width:130px;border:2px solid var(--ink)">`:''}</div><ol class="trk">${tr.length?tr.map((t,i)=>`<li class="${i+1==it.fav?'fav':''}">${i+1==it.fav?'⭐ ':''}${esc(t)}</li>`).join(''):'<li style="opacity:.6">Aucune entrée</li>'}</ol>`}
 return `<div style="display:flex;gap:14px;flex-wrap:wrap">${th(it,'width:150px;height:210px')}<div style="flex:1;min-width:200px"><h2>${esc(it.t)}</h2><span class="badge">${TL[it.tab]}</span>${it.mood?`<span class="badge" style="background:#e3dcff">${esc(it.mood)}</span>`:''}<p>${esc(it.avis)}</p></div></div>`;

$('#exp').onclick=()=>{
 const files=[],clean=it=>{const o={...it};if(o.img&&o.img.startsWith('data:')){files.push([o.id+'.jpg',o.img]);o.img='images/'+o.id+'.jpg'}return o};

};

 if(t.closest('[data-clear]')){if(confirm('Effacer toutes les données locales de ce navigateur ?')){['loc','moods3'].forEach(k=>localStorage.removeItem(k));location.reload()}return}
